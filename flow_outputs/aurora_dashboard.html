const GAPS=['Segment-level export: measured 0.01 mi breakdown points and segment-level pace persistence.','Nutrition log: day-before calories, carbohydrate and protein associations.','Lifting log: bodyweight and strength context around breakdowns.','Hydration and in-run fuelling records: whether fluid or carbohydrate intake preceded long-run fades.','Sleep records: whether sleep quantity or quality preceded breakdowns.','Weather records: temperature and other environmental effects on pace fade.'];
const NUTRITION=JSON.parse(localStorage.getItem('aurora_nutrition')||'[]'), LIFTS=JSON.parse(localStorage.getItem('aurora_lifts')||'[]');let charts=[];
function go(h){location.hash=h;render()}function openSheet(){$('#sheet').classList.add('open')}function closeSheet(){$('#sheet').classList.remove('open')}function toast(x){let t=$('#toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function avg(arr,key){let x=arr.map(a=>+a[key]).filter(Number.isFinite);return x.length?x.reduce((a,b)=>a+b,0)/x.length:null}
function latest(){return RUNS[RUNS.length-1]}function days(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
function breakdown(r){let p=r.splits.map(paceSec), base=avg(p.slice(0,Math.max(1,Math.ceil(p.length/3))));let i=p.findIndex((x,n)=>n>=2&&x>=base+240||x>=900);return i<0?null:+(i+1).toFixed(2)}
function type(r){let s=r.avgHR/198;return s<.82?'Easy':s<.86?'Steady':'Quality'}
function nav(active){return`<nav class="nav">${[['#home','⌂','HOME'],['#runs','◉','RUNS'],['#lift','✚','LIFT'],['#fuel','◒','FUEL'],['#analysis','◈','ANALYSIS'],['#data','▦','DATA']].map(x=>`<a class="${active===x[0].slice(1)?'active':''}" href="${x[0]}">${x[1]}<br>${x[2]}</a>`).join('')}</nav>`}
function shell(content,active){$('#app').innerHTML=`<main class="app"><header class="top"><div class="brand">AURORA <b>ATHLETE</b></div><div class="pill live">● LIVE · 72 runs</div></header>${nav(active)}${content}</main>`}
function chart(id,type,data,opts={}){requestAnimationFrame(()=>{let c=document.getElementById(id);if(c)charts.push(new Chart(c,{type,data,options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#b8c3d8',font:{size:10}}}},scales:{x:{ticks:{color:'#91a0ba'},grid:{color:'#ffffff0b'}},y:{ticks:{color:'#91a0ba'},grid:{color:'#ffffff0b'}}},...opts}}))})}
function home(){let r=latest(),wk=RUNS.filter(x=>new Date(x.date)>=new Date('2026-11-09')),miles=wk.reduce((a,x)=>a+x.distance,0),streak=RUNS.slice().reverse().findIndex((x,i)=>i&&days(RUNS[RUNS.length-i-1].date,x.date)>7);shell(`<section class="card hero"><div class="eyebrow">Latest sync</div><h1>Training, made <span class="gradient">clear.</span></h1><div class="grid3"><div><b class="value">${SUMMARY.total_runs}</b><div class="label">runs</div></div><div><b class="value">${SUMMARY.total_miles}</b><div class="label">miles</div></div><div><b class="value">${SUMMARY.latest_run_date}</b><div class="label">${SUMMARY.latest_run_distance} mi latest</div></div></div></section>
<section class="card"><div class="row"><div><div class="eyebrow">Training signal</div><h2 class="good">EASY</h2><p class="muted">Keep the next session controlled: recent load is concentrated and long-run durability remains the priority.</p></div><div class="value gradient">1.28</div></div><small class="muted">Official ACWR from coaching analysis · moderate risk</small></section>
<section class="card run" onclick="go('#runs/${r.date}')"><div class="eyebrow">Latest run analysed</div><div class="row"><div><h2>${r.date}</h2><div class="muted">${r.distance} mi · ${r.avgPace}/mi · ${type(r)} · ${r.avgHR} bpm</div></div><div class="big gradient">${r.avgPace}</div></div><p class="small">Score 8/10 · ${breakdown(r)?'breaks at mile '+breakdown(r):'held pace all the way'}</p></section>
<div class="grid"><section class="card run" onclick="go('#analysis/struggle')"><div class="eyebrow">Your weak spot</div><h3>Long-run durability</h3><p class="small">${WEAK[0]}</p></section><section class="card"><div class="eyebrow">This week</div><div class="value">${miles.toFixed(2)} mi</div><p class="muted">${wk.length} runs · planned long run 6–7 mi</p><div class="bar"><i style="width:${Math.min(100,miles/24*100)}%"></i></div></section></div>
<div class="grid">${[['ACWR','1.28','coaching analysis'],['Run streak',streak<0?'not recorded':streak+' days','current'],['28-day mileage',RUNS.slice(-10).reduce((a,x)=>a+x.distance,0).toFixed(1),'computed'],['Risk','Moderate','load pattern']].map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value ${x[0]==='Risk'?'warn':''}">${x[1]}</div><div class="label">${x[2]}</div></div>`).join('')}</div>
<section class="card"><div class="eyebrow">Needs your attention</div><h3>Five coaching decisions remain open</h3><p class="small muted">Confirm the ACWR method and threshold, review the recurring long-run breakdown, obtain segment-level data, and collect lifting, nutrition, sleep, hydration and weather records.</p><button onclick="go('#analysis/struggle')">Review analysis</button></section>
<section class="card"><div class="eyebrow">Up next</div><h3>4–5 flat miles easy</h3><p class="muted">Take one rest day, then keep HR near the latest run's 155 bpm and avoid concentrated climbing.</p></section>`, 'home')}
function runs(){shell(`<div class="row"><div><div class="eyebrow">Post-run experience</div><h1>Runs</h1></div><button onclick="go('#log/run')">＋ Log</button></div><div class="card chartbox"><canvas id="trend"></canvas></div><div>${RUNS.slice().reverse().map(r=>`<article class="card run" onclick="go('#runs/${r.date}')"><div class="row"><div><div class="eyebrow">${r.date} · ${type(r)}</div><h3>${r.distance} mi · ${r.avgPace}/mi</h3><div class="muted">${r.avgHR} bpm · ${r.cadence} spm</div></div><span class="chip ${breakdown(r)?'risk':'good'}">${breakdown(r)?'breaks at mi '+breakdown(r):'no breakdown'}</span></div></article>`).join('')}</div>`,'runs');chart('trend','line',{labels:RUNS.map(r=>r.date.slice(5)),datasets:[{label:'Pace sec/mi',data:RUNS.map(r=>paceSec(r.avgPace)),borderColor:'#00f5ff',tension:.35,pointRadius:0}]})}
function runPage(date){let r=RUNS.find(x=>x.date===date);if(!r){go('#runs');return}let b=breakdown(r),p=r.splits.map(paceSec),base=avg(p.slice(0,Math.max(1,Math.ceil(p.length/3))));let prev=RUNS[RUNS.indexOf(r)-1],next=RUNS[RUNS.indexOf(r)+1];shell(`<div class="actions"><button onclick="go('#runs')">← Runs</button>${prev?`<button onclick="go('#runs/${prev.date}')">‹ Prev</button>`:''}${next?`<button onclick="go('#runs/${next.date}')">Next ›</button>`:''}</div><section class="card hero"><div class="eyebrow">${r.date} · ${type(r)}</div><div class="big gradient">${r.avgPace}</div><p>${r.distance} miles · ${r.time} · ${r.avgHR} bpm · ${r.ascent} ft ascent</p><div class="grid3"><div class="stat"><b class="value">${r.avgHR}</b><div class="label">avg HR</div></div><div class="stat"><b class="value">${r.cadence}</b><div class="label">cadence</div></div><div class="stat"><b class="value">${b||'—'}</b><div class="label">${b?'breakdown mi':'held pace'}</div></div></div></section>
<section class="card"><h2>Lap splits</h2><div class="chartbox"><canvas id="split"></canvas></div><p class="small muted">Baseline ${fmt(base)}/mi · ${b?'Estimated breakdown marker at mile '+b:'No estimated breakdown detected'} · computed from audited lap splits.</p></section>
<section class="card"><h2>Run context</h2><div class="grid">${[['Climb per mile',(r.ascent/r.distance).toFixed(1)+' ft/mi'],['HR %',(r.avgHR/198*100).toFixed(1)+'%'],['Best pace',r.bestPace+'/mi'],['Calories',r.calories+' kcal'],['Laps',r.laps],['Source','Garmin FIT']].map(x=>`<div class="stat"><div class="label">${x[0]}</div><b>${x[1]}</b></div>`).join('')}</div></section>
<section class="card"><h2>Coach report</h2><p><b>${r.distance<5?'Recovery':r.distance<=9?'Medium aerobic':'Long durability'} session.</b> This run is compared with the athlete's ${band(r.distance).toLowerCase()} band. Pace, HR, cadence and climbing are taken directly from the audited row. The supplied breakdown source was estimated from lap splits; segment-level export was unavailable.</p></section>`, 'runs');chart('split','line',{labels:r.splits.map((_,i)=>'Lap '+(i+1)),datasets:[{label:'Pace',data:p,borderColor:'#00f5ff',backgroundColor:'#00f5ff22',fill:true,tension:.25},{label:'Baseline',data:p.map(()=>base),borderColor:'#ffb300',borderDash:[5,5],pointRadius:0}]},{scales:{y:{reverse:true,ticks:{callback:v=>fmt(v)}}}})}
function logRun(){shell(`<div class="actions"><button onclick="go('#runs')">← Back</button></div><section class="card"><div class="eyebrow">Quick log</div><h1>Log a run</h1><form id="runform"><label>Date<input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></label><label>Distance, miles<input name="distance" type="number" step=".01" required></label><label>Time<input name="time" placeholder="45:00" required></label><label>Average HR<input name="hr" type="number" required></label><label>RPE<input name="rpe" type="number" min="1" max="10" step=".1"></label><button class="primary" type="submit">Save and view report</button></form></section>`, 'runs');$('#runform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),time=f.get('time'),sec=paceSec(time),d=+f.get('distance');let r={date:f.get('date'),distance:d,time,avgHR:+f.get('hr'),maxHR:null,cadence:null,avgPace:fmt(sec/d),bestPace:null,ascent:null,laps:null,splits:[],calories:null,pending:true};RUNS.push(r);RUNS.sort((a,b)=>a.date.localeCompare(b.date));localStorage.setItem('aurora_runs',JSON.stringify(RUNS));toast('Run saved · pending Garmin sync');go('#runs/'+r.date)}}
function lift(){shell(`<section class="card"><div class="eyebrow">Lifting data status</div><h1>Start lifting</h1><div class="empty"><h3>NO DATA</h3><p>lifting_log_url returned nothing. No lifting table was available, so e1RM, RPE, bodyweight and strength trends cannot be calculated.</p><button class="primary" onclick="go('#lift/session/new')">Start session</button></div></section><section class="card"><h2>Provisional priorities</h2><p class="muted">Posterior-chain strength, calf and soleus capacity, single-leg stability, and trunk control based on the running durability profile. These are not measured lifting weaknesses.</p></section>`, 'lift')}
function session(id){shell(`<section class="card"><div class="eyebrow">Lift logger</div><h1>${id==='new'?'New session':'Session report'}</h1><form id="liftform"><label>Date<input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Bodyweight lb<input name="bw" type="number" placeholder="not recorded"></label><label>Exercise<input name="exercise" placeholder="Squat, row, pull-up"></label><label>Weight lb<input name="weight" type="number"></label><label>Reps<input name="reps" type="number"></label><label>RPE<input name="rpe" type="number" min="6" max="10" step=".1"></label><button class="primary">END SESSION</button></form></section>`,'lift');$('#liftform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),row=Object.fromEntries(f);row.id=Date.now();LIFTS.push(row);localStorage.setItem('aurora_lifts',JSON.stringify(LIFTS));toast('Lift session saved');go('#lift/session/'+row.id)}}
function fuel(date){let d=date||new Date().toISOString().slice(0,10),n=NUTRITION.find(x=>x.date===d),r=RUNS.find(x=>x.date===d);shell(`<section class="card"><div class="eyebrow">Fuel · ${d}</div><h1>${n?'Daily totals':'Fuel today'}</h1>${n?`<div class="grid3">${[['Calories',n.kcal],['Protein',n.protein],['Carbs',n.carbs]].map(x=>`<div class="stat"><b class="value">${x[1]??'not recorded'}</b><div class="label">${x[0]}</div></div>`).join('')}</div>`:`<div class="empty">NO DATA: nutrition_log_url returned nothing. Import a CalTrak CSV to add daily totals.</div>`}${r?`<p class="muted">Run calories: ${r.calories??'not recorded'} · energy balance is not total daily burn.</p>`:''}</section><section class="card"><h2>Import CalTrak CSV</h2><input id="csv" type="file" accept=".csv,text/csv"><p class="small muted">CSV is parsed locally. Missing columns remain not recorded.</p></section>`,'fuel');$('#csv').onchange=e=>importCSV(e.target.files[0])}
function importCSV(file){if(!file)return;let rd=new FileReader;rd.onload=()=>{let lines=rd.result.trim().split(/\r?\n/).map(x=>x.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(y=>y.replace(/^"|"$/g,''))),h=lines.shift().map(x=>x.toLowerCase()),ix=k=>h.findIndex(x=>k.some(y=>x===y||x.includes(y))),di=ix(['date','day']),ci=ix(['calories','kcal','energy']),pi=ix(['protein']),ca=ix(['carbs','carbohydrates']),fi=ix(['fat']),map={};lines.forEach(a=>{let date=a[di];if(!date)return;map[date]=map[date]||{date,kcal:0,protein:null,carbs:null,fat:null};let add=(i,k)=>{if(i>=0&&a[i]!==''&&!isNaN(+a[i]))map[date][k]=(map[date][k]||0)+ +a[i]};add(ci,'kcal');add(pi,'protein');add(ca,'carbs');add(fi,'fat')});let x=Object.values(map);NUTRITION.push(...x);localStorage.setItem('aurora_nutrition',JSON.stringify(NUTRITION));toast('CalTrak import saved');go('#fuel/'+x[x.length-1].date)};rd.readAsText(file)}
function analysis(sec){let long=RUNS.filter(r=>r.distance>9),weeks={};RUNS.forEach(r=>{let d=new Date(r.date),m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));let k=m.toISOString().slice(0,10);weeks[k]=(weeks[k]||0)+r.distance});shell(`<div class="sectionnav">${['struggle','breakdown','load','fitness','fuel','strength'].map(x=>`<a class="${sec===x?'active':''}" href="#analysis/${x}">${x}</a>`).join('')}</div>${sec==='struggle'?`<section class="card"><div class="eyebrow">Where you struggle</div><h1>Long-run durability</h1>${WEAK.map((x,i)=>`<article class="stat" style="margin:8px 0"><b>${i+1}. ${x}</b></article>`).join('')}<p class="muted">The clearest measured-from-laps pattern is long-run durability: 7 of 24 long runs broke down, with a median estimated point of 7.79 mi, or 52.0% of distance.</p><span class="chip warn">ESTIMATED FROM AUDITED LAP SPLITS</span></section>`:''}${sec==='breakdown'?`<section class="card"><h2>Breakdown finder</h2><p class="muted">Source: lap_splits; segments file unavailable. Breakdown values are estimated from laps.</p>${long.map(r=>`<div class="row stat" style="margin:8px 0"><span>${r.date} · ${r.distance} mi</span><b class="${breakdown(r)?'risk':'good'}">${breakdown(r)||'none'}</b></div>`).join('')}</section>`:''}${sec==='load'?`<section class="card"><h2>Training load</h2><div class="chartbox"><canvas id="load"></canvas></div><p class="muted">Computed weekly mileage from the 72 audited activity rows. Official coaching ACWR is 1.28; the source does not expose the exact rolling-window method, so confirm whether it crosses the 1.5 critical threshold before progressing volume.</p></section>`:''}${sec==='fitness'?`<section class="card"><h2>Fitness trend</h2><div class="chartbox"><canvas id="fit"></canvas></div><p class="muted">Pace and HR are shown from recorded runs only; terrain and effort are not controlled.</p></section>`:''}${sec==='fuel'?`<section class="card"><h2>Fuel analysis</h2><div class="empty">NO DATA: nutrition_log_url returned nothing. Import CalTrak data to calculate energy balance, protein per lb and pre-run carbohydrate relationships.</div></section>`:''}${sec==='strength'?`<section class="card"><h2>Strength</h2><div class="empty">NO DATA: lifting_log_url returned nothing. Start a lift session to build e1RM, relative strength and bodyweight trends.</div></section>`:''}`, 'analysis');if(sec==='load')chart('load','bar',{labels:Object.keys(weeks),datasets:[{label:'Miles',data:Object.values(weeks),backgroundColor:'#7c3aed'}]});if(sec==='fitness')chart('fit','scatter',{datasets:[{label:'Runs',data:RUNS.filter(r=>r.avgHR).map(r=>({x:r.avgHR,y:paceSec(r.avgPace)})),backgroundColor:'#00f5ff'}]})}
function data(){shell(`<div class="row"><h1>Data</h1><button onclick="downloadCSV()">Export activity CSV</button></div><section class="card"><div class="eyebrow">Activity log · ${RUNS.length} rows</div><input id="search" placeholder="Search date or distance"><div class="tablewrap"><table><thead><tr><th>Date</th><th>Distance</th><th>Time</th><th>HR</th><th>Cadence</th><th>Pace</th><th>Best</th><th>Calories</th><th>Ascent</th><th>Laps</th></tr></thead><tbody id="tb"></tbody></table></div></section><section class="card"><h2>Audit notes</h2><p class="muted">72/72 Running · 72/72 Garmin FIT · no duplicates removed · title, stride length, TSS and steps blank · weather fields absent · timestamps assumed UTC; local date from filename. The 2026-07-26 activity has a local-vs-UTC date note in the audit.</p></section>`, 'data');let fill=()=>{$('#tb').innerHTML=RUNS.filter(r=>r.date.includes($('#search').value)||String(r.distance).includes($('#search').value)).map(r=>`<tr onclick="go('#runs/${r.date}')"><td>${r.date}</td><td>${r.distance}</td><td>${r.time}</td><td>${r.avgHR}</td><td>${r.cadence}</td><td>${r.avgPace}</td><td>${r.bestPace}</td><td>${r.calories}</td><td>${r.ascent}</td><td>${r.laps}</td></tr>`).join('')};$('#search').oninput=fill;fill()}
function downloadCSV(){let h='Date,Distance,Time,Avg HR,Max HR,Cadence,Avg Pace,Best Pace,Calories,Ascent,Laps\\n';let x=h+RUNS.map(r=>[r.date,r.distance,r.time,r.avgHR,r.maxHR,r.cadence,r.avgPace,r.bestPace,r.calories,r.ascent,r.laps].join(',')).join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'text/csv'}));a.download='activity.csv';a.click()}
function render(){charts.forEach(c=>c.destroy());charts=[];let h=location.hash||'#home',p=h.split('/');if(h==='#home')home();else if(h==='#runs')runs();else if(p[1]==='runs')runPage(p[2]);else if(h==='#log/run')logRun();else if(h==='#lift')lift();else if(p[1]==='lift')session(p[3]||'new');else if(h==='#fuel')fuel();else if(p[1]==='fuel')fuel(p[2]);else if(h.startsWith('#analysis'))analysis(p[2]||'struggle');else if(h==='#data')data();else home()}
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
