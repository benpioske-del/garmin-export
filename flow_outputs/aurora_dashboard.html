${card(`<div class="eyebrow">Latest run analysed</div><h2>${r.date}</h2><div class="value gradient">${r.distance} mi</div><p class="sub">${r.avgPace}/mi · ${r.avgHR} bpm · Easy</p><button class="btn" onclick="navigate('#runs/${r.date}')">Open full report</button>`,`card half`)}
${card(`<div class="eyebrow">This week</div><div class="stats"><div class="stat"><div class="label">Miles</div><div class="value">${SUMMARY.this_week_miles}</div></div><div class="stat"><div class="label">Runs</div><div class="value">${week.length}</div></div><div class="stat"><div class="label">Last week</div><div class="value">${last.reduce((a,x)=>a+x.distance,0).toFixed(2)}</div></div><div class="stat"><div class="label">Planned long run</div><div class="value">9–10</div></div></div>`,`card half`)}
${card(`<div class="eyebrow">Four signals</div><div class="stats"><div class="stat"><div class="label">ACWR</div><div class="value warn">1.24</div></div><div class="stat"><div class="label">Run streak</div><div class="value">2</div></div><div class="stat"><div class="label">Days since rest</div><div class="value">${days}</div></div><div class="stat"><div class="label">28-day miles</div><div class="value">${RUNS.filter(x=>new Date(x.date)>=new Date("2026-10-15")).reduce((a,x)=>a+x.distance,0).toFixed(1)}</div></div></div>`,`card`)}
${card(`<div class="eyebrow">Needs your attention</div><ul class="attention"><li>Review the 2026-07-26 local date versus UTC date discrepancy.</li><li>Lifting logs are unavailable; e1RM progression cannot be assessed.</li><li>Nutrition logs are unavailable; fueling adequacy cannot be evaluated.</li><li>Official ACWR is 1.24, below the 1.5 critical threshold.</li></ul>`,`card attention`)}
${card(`<div class="eyebrow">Top coaching directive</div><h2>Improve long-run pace durability</h2><p class="sub">Keep long runs easy and uniform. Reduce fade rather than forcing long runs to short-run pace.</p><a class="btn" href="#analysis">View coaching plan</a>`,`card half`)}
${card(`<div class="eyebrow">Up next</div><h2>Recovery or 4–5 easy miles</h2><p class="sub">One complete rest day after the latest 6.48-mile run, then run only if 155 bpm or lower is achievable without soreness.</p>`,`card half`)}</div></div>`}
function runs(){
return `<div class="view">${header("Runs",`${RUNS.length} activities · ${SUMMARY.total_miles} miles`)}<div class="section-title"><h2>Activity feed</h2><a class="btn" href="#log/run">+ Log run</a></div>${RUNS.slice().reverse().map(r=>`<a class="run-card" href="#runs/${r.date}"><div><div class="run-date">${r.date}</div><div class="run-meta">${r.avgPace}/mi · ${r.avgHR} bpm · ${r.band}</div></div><div><div class="run-distance">${r.distance} <small>mi</small></div><span class="chip">${r.band}</span></div></a>`).join("")}</div>`}
function detail(date){
let r=RUNS.find(x=>x.date===date);if(!r)return runs();let idx=RUNS.indexOf(r),prev=RUNS[idx-1],same=RUNS.filter(x=>x.band===r.band&&x.date<r.date).pop(),score=Math.max(5,Math.min(10,Math.round(10-(r.avgHR-150)/12)));
let split=r.splits||[], fuel=NUTRITION.find(x=>x.date===date);
return `<div class="view">${header(date,`${r.distance} mi · ${r.band} run`)}<div class="grid">${card(`<div class="eyebrow">Run score</div><div class="value gradient">${score}/10</div><p class="sub">Computed from recorded pace, heart rate and distance band.</p>`,`card third`)}${card(`<div class="eyebrow">Pace</div><div class="value">${r.avgPace}</div><p class="sub">Best ${r.bestPace}/mi</p>`,`card third`)}${card(`<div class="eyebrow">Heart rate</div><div class="value">${r.avgHR}</div><p class="sub">Max ${r.maxHR} bpm · cadence ${r.cadence}</p>`,`card third`)}${card(`<div class="eyebrow">Elevation</div><div class="value">${r.ascent}</div><p class="sub">ft ascent · ${r.descent} ft descent</p>`,`card half`)}${card(`<div class="eyebrow">Recorded source</div><p class="sub">${r.source}<br>${r.calories} calories · ${r.laps} laps</p>`,`card half`)}${card(`<div class="eyebrow">Splits</div>${split.length?`<div class="chartbox"><canvas id="splits"></canvas></div>`:`<div class="empty"><strong>Splits not recorded in this view</strong>The activity source did not provide a transcribed split list.</div>`}`,`card half`)}${card(`<div class="eyebrow">Computed comparison</div><div class="stats"><div class="stat"><div class="label">Band pace</div><div class="value">${avg(RUNS.filter(x=>x.band===r.band),"paceSec")||"—"}</div></div><div class="stat"><div class="label">Band HR</div><div class="value">${fmt(avg(RUNS.filter(x=>x.band===r.band),"avgHR"))}</div></div><div class="stat"><div class="label">Similar run</div><div class="value">${same?same.avgPace:"—"}</div></div><div class="stat"><div class="label">Moving time</div><div class="value">${r.time}</div></div></div>`,`card half`)}${fuel?card(`<div class="eyebrow">Fuel that day</div><p>${fuel.kcal??"not recorded"} kcal · ${fuel.protein??"not recorded"}g protein · ${fuel.carbs??"not recorded"}g carbs</p>`,`card`):card(`<div class="empty"><strong>No nutrition logged</strong>CalTrak returned no nutrition record for ${date}.</div>`,`card`)}${card(`<div class="report">${reports[date]||`<h2>Computed run report</h2><p>This ${r.distance}-mile ${r.band.toLowerCase()} run averaged ${r.avgPace}/mi at ${r.avgHR} bpm. The source report was not supplied, so this comparison is computed directly from the activity rows.</p>`}</div>`,`card`)}</div><div class="section-title">${prev?`<a class="btn ghost" href="#runs/${prev.date}">← Previous</a>`:""}${idx<RUNS.length-1?`<a class="btn ghost" href="#runs/${RUNS[idx+1].date}">Next →</a>`:""}</div></div>`}
function logRun(){return `<div class="view">${header("Log a run","Quick log · pending Garmin sync")}<section class="card form"><label>Date<input id="ld" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Distance (mi)<input id="lx" type="number" step=".01" required></label><label>Time<input id="lt" type="text" placeholder="45:00"></label><label>Average HR<input id="lh" type="number"></label><label>RPE <input id="lr" type="number" min="1" max="10" value="5"></label><button class="btn" onclick="saveRun()">Save and open report</button></section></div>`}
function saveRun(){let date=ld.value,d=+lx.value,t=lt.value||"0:00",hr=+lh.value||null,sec=paceSec(t)/(d||1),p=`${Math.floor(sec/60)}:${String(Math.round(sec%60)).padStart(2,"0")}`,r={date,distance:d,time:t,avgHR:hr,maxHR:null,cadence:null,avgPace:p,bestPace:null,best5k:null,splits:null,ascent:null,descent:null,calories:null,laps:null,bestLap:null,source:"Quick log · pending Garmin sync",band:d<5?"SHORT":d<=9?"MEDIUM":"LONG"};RUNS.push(r);RUNS.sort((a,b)=>a.date.localeCompare(b.date));localStorage.setItem("aurora_last_seen_run",date);show("Run saved · pending Garmin sync");navigate("#runs/"+date)}
function fuel(date){let rows=NUTRITION.filter(x=>!date||x.date===date);return `<div class="view">${header(date||"Fuel","CalTrak nutrition")}<section class="card"><div class="section-title"><h2>${date||"Today"}</h2><label class="btn ghost">Import CSV<input type="file" accept=".csv,text/csv" hidden onchange="importCSV(event)"></label></div>${rows.length?rows.map(x=>`<a class="run-card" href="#fuel/${x.date}"><div><b>${x.date}</b><div class="run-meta">Calories ${x.kcal??"not recorded"} · Protein ${x.protein??"not recorded"}g</div></div><div class="run-distance">${x.carbs??"—"}<small>g carbs</small></div></a>`).join(""):`<div class="empty"><strong>Nutrition unavailable</strong>NO DATA: nutrition_log_url returned nothing. Import a CalTrak CSV to add daily totals.</div>`}</section><section class="card"><div class="eyebrow">How to use CalTrak</div><p class="sub">Export your food log from CalTrak on your phone, then choose the CSV above. Missing columns remain not recorded.</p></section></div>`}
function importCSV(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader;rd.onload=()=>{let lines=rd.result.trim().split(/\r?\n/),h=lines.shift().split(",").map(x=>x.trim().toLowerCase()),find=(...a)=>h.findIndex(x=>a.some(k=>x===k||x.includes(k))),di=find("date","day"),ki=find("calories","kcal","energy"),pi=find("protein"),ci=find("carbs","carbohydrates"),fi=find("fat"),map={};lines.forEach(l=>{let v=l.split(",");let date=v[di];if(!date)return;let x=map[date]||{date,kcal:0,protein:0,carbs:0,fat:0};if(ki>=0)x.kcal+=+v[ki]||0;if(pi>=0)x.protein+=+v[pi]||0;if(ci>=0)x.carbs+=+v[ci]||0;if(fi>=0)x.fat+=+v[fi]||0;map[date]=x});let imported=Object.values(map);localStorage.setItem("aurora_nutrition",JSON.stringify([...NUTRITION.filter(x=>!map[x.date]),...imported]));show("CalTrak imported");navigate("#fuel/"+(imported.at(-1)?.date||""))};rd.readAsText(f)}
function weeklyBars(runs){
  var m = {};
  runs.forEach(function (r) {
    var d = new Date(r.date + "T00:00:00");
    var day = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - day);
    var k = d.toISOString().slice(0, 10);
    if (!m[k]) { m[k] = { miles: 0, runs: 0 }; }
    m[k].miles += r.distance || 0;
    m[k].runs += 1;
  });
  var keys = Object.keys(m).sort();
  return {
    labels: keys.map(function (k) { return k.slice(5); }),
    miles: keys.map(function (k) { return Math.round(m[k].miles * 100) / 100; }),
    runs: keys.map(function (k) { return m[k].runs; })
  };
}
function bandColor(band){
  return band === "SHORT" ? "#10ffa0" : band === "LONG" ? "#7c3aed" : "#00f5ff";
}
function fadePct(splits){
  if (!splits || splits.length < 2) { return null; }
  var half = Math.floor(splits.length / 2);
  var first = splits.slice(0, half);
  var second = splits.slice(splits.length - half);
  var a = first.reduce(function (p, v) { return p + v; }, 0) / first.length;
  var b = second.reduce(function (p, v) { return p + v; }, 0) / second.length;
  if (!a) { return null; }
  return Math.round((b - a) / a * 1000) / 10;
}
function analysis(){
  var tick = { ticks: { color: "#8991a8" }, grid: { color: "#ffffff0b" } };
  return `<div class="view">${header("Analysis","Every chart is computed from the live activity rows.")}<div class="grid">
    ${card(`<div class="eyebrow">Training load</div><div class="chartbox"><canvas id="load"></canvas></div><p class="sub">Miles per run across the full retained history.</p>`,`card`)}
    ${card(`<div class="eyebrow">Weekly mileage</div><div class="chartbox"><canvas id="weekly"></canvas></div><p class="sub">Miles and run count by week.</p>`,`card half`)}
    ${card(`<div class="eyebrow">Distance by run</div><div class="chartbox"><canvas id="dist"></canvas></div><p class="sub">Each bar is a run in chronological order, coloured by distance band.</p>`,`card half`)}
    ${card(`<div class="eyebrow">Pace and heart rate</div><div class="chartbox"><canvas id="pacehr"></canvas></div><p class="sub">Average pace and average heart rate over time.</p>`,`card`)}
    ${card(`<div class="eyebrow">Fitness trend</div><div class="chartbox"><canvas id="fit"></canvas></div><p class="sub">Recorded pace against average heart rate.</p>`,`card half`)}
    ${card(`<div class="eyebrow">Run bubbles</div><div class="chartbox"><canvas id="bubble"></canvas></div><p class="sub">Sequence, pace and distance at a glance.</p>`,`card half`)}
    ${card(`<div class="eyebrow">Pacing fade</div><div class="chartbox"><canvas id="fade"></canvas></div><p class="sub">Second-half pace vs first-half pace, per run with splits. Below zero is a negative split.</p>`,`card`)}
    ${card(`<div class="eyebrow">Bodyweight</div><div class="empty"><strong>No bodyweight recorded</strong>Add a weight measurement to plot the trend.</div>`,`card half`)}
    ${card(`<div class="eyebrow">Strength 1RM</div><div class="empty"><strong>No strength sessions</strong>Log a session in LIFT to plot estimated 1RM.</div>`,`card half`)}
    ${card(`<div class="eyebrow">Distance bands</div><div class="stats">${Object.entries(COACH.grades).map(function(e){return `<div class="stat"><div class="label">${e[0]}</div><div class="value">${e[1][0]}</div><p class="sub">${e[1][1]}</p></div>`}).join("")}</div>`,`card`)}
    ${card(`<div class="eyebrow">Injury risk</div><h2 class="warn">Moderate</h2><p class="sub">The official ACWR is ${COACH.acwr != null ? COACH.acwr.toFixed(2) : "unavailable"}, below the 1.5 critical threshold. Recent short-term loading still warrants caution.</p>`,`card half`)}
    ${card(`<div class="eyebrow">Four-week plan</div><p class="sub"><b>Week 1:</b> 20-22 mi, recovery and stabilization.<br><b>Week 2:</b> 22-24 mi, controlled tempo.<br><b>Week 3:</b> 24-26 mi, moderate build.<br><b>Week 4:</b> 20-22 mi, deload.</p>`,`card half`)}
  </div></div>`}
function data(){return `<div class="view">${header("Data","Source rows, audit notes and quality status")}<section class="card"><div class="section-title"><h2>Activity log · ${RUNS.length} rows</h2><input id="search" placeholder="Search date or band" oninput="filterRows()"></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Distance</th><th>Pace</th><th>HR</th><th>Cadence</th><th>Ascent</th><th>Calories</th></tr></thead><tbody id="rows">${RUNS.slice().reverse().map(row).join("")}</tbody></table></div></section><section class="card"><div class="eyebrow">Audit and data quality</div><p class="sub">72/72 records retained. No duplicates or corrections. Title, average stride length, training stress score and steps are blank in every record. No weather fields were present.</p><p class="sub">Review required: 2026-07-26 local activity date and filename versus 2026-07-27 UTC timestamp. Long laps on 2026-06-07, 2026-09-09, 2026-09-24 and 2026-10-01 may indicate slowdowns or stoppages.</p></section><section class="card"><div class="eyebrow">Lifting data</div><div class="empty"><strong>NO DATA: lifting_log_url returned nothing.</strong>Audit returned no lifting sessions. Start a lift session to begin tracking.</div></section></div>`}
function row(r){return `<tr onclick="navigate('#runs/${r.date}')"><td>${r.date}</td><td>${r.distance}</td><td>${r.avgPace}</td><td>${r.avgHR}</td><td>${r.cadence??"not recorded"}</td><td>${r.ascent??"not recorded"}</td><td>${r.calories??"not recorded"}</td></tr>`}
function filterRows(){let q=search.value.toLowerCase();rows.innerHTML=RUNS.slice().reverse().filter(r=>(r.date+r.band).toLowerCase().includes(q)).map(row).join("")}
function lift(){return `<div class="view">${header("Lift","Strength logger")}<section class="card"><div class="empty"><strong>NO DATA: lifting_log_url returned nothing.</strong>Audit returned no lifting sessions. No e1RM, bodyweight or relative-strength values were invented.</div><button class="btn" onclick="startLift()">Start session</button></section></div>`}
function startLift(){let id=Date.now();localStorage.setItem("aurora_lift_"+id,JSON.stringify({id,date:new Date().toISOString().slice(0,10),sets:[]}));show("Lift session started");navigate("#lift/session/"+id)}
function session(id){return `<div class="view">${header("Lift session","Session logger")}<section class="card form"><label>Bodyweight (lb)<input id="bw" type="number" placeholder="not recorded"></label><label>Exercise<input id="ex" placeholder="e.g. Romanian deadlift"></label><label>Weight (lb)<input id="ww" type="number"></label><label>Reps<input id="rr" type="number"></label><label>RPE<input id="rp" type="range" min="6" max="10" value="7"></label><button class="btn" onclick="endSession('${id}')">END SESSION</button></section></div>`}
function endSession(id){let s=JSON.parse(localStorage.getItem("aurora_lift_"+id)||"{}");s.bodyweight=+bw.value||null;s.sets=[{exercise:ex.value||"not recorded",weight:+ww.value||null,reps:+rr.value||null,rpe:+rp.value}];localStorage.setItem("aurora_lift_"+id,JSON.stringify(s));show("Lift session saved");navigate("#lift/session/"+id+"/report")}
function sessionReport(id){let s=JSON.parse(localStorage.getItem("aurora_lift_"+id)||"{}");return `<div class="view">${header("Session report",s.date||"Saved session")}<section class="card"><div class="stats"><div class="stat"><div class="label">Sets</div><div class="value">${s.sets?.length||0}</div></div><div class="stat"><div class="label">Bodyweight</div><div class="value">${s.bodyweight||"—"}</div></div></div><p class="sub">This session is saved locally. e1RM is shown only when load and reps were entered.</p><button class="btn" onclick="navigate('#lift')">Back to lift</button></section></div>`}
function render(){
  charts.forEach(function (c) { c.destroy(); });
  charts = [];
  navActive();
  var h = location.hash || "#home", v = h.slice(1);
  var html = v === "home" ? home()
    : v === "runs" ? runs()
    : v.startsWith("runs/") ? detail(v.split("/")[1])
    : v === "log/run" ? logRun()
    : v === "fuel" ? fuel()
    : v.startsWith("fuel/") ? fuel(v.split("/")[1])
    : v === "analysis" ? analysis()
    : v === "data" ? data()
    : v === "lift" ? lift()
    : v.startsWith("lift/session/") ? (v.endsWith("/report") ? sessionReport(v.split("/")[2]) : session(v.split("/")[2]))
    : home();
  document.getElementById("app").innerHTML = html;
  var tick = { ticks: { color: "#8991a8" }, grid: { color: "#ffffff0b" } };
  if (v === "analysis") {
    chart("load", "line", {labels: RUNS.map(function (r) { return r.date.slice(5); }), datasets: [{label: "Miles", data: RUNS.map(function (r) { return r.distance; }), borderColor: "#00f5ff", backgroundColor: "#00f5ff22", fill: true, tension: .3}]}, {scales: {x: tick, y: tick}});
    var w = weeklyBars(RUNS);
    chart("weekly", "bar", {labels: w.labels, datasets: [{label: "Miles", data: w.miles, backgroundColor: "#7c3aed"}, {label: "Runs", data: w.runs, type: "line", borderColor: "#10ffa0", backgroundColor: "#10ffa0", yAxisID: "y1", tension: .3}]}, {scales: {x: tick, y: {beginAtZero: true, ticks: {color: "#8991a8"}, grid: {color: "#ffffff0b"}, title: {display: true, text: "Miles", color: "#8991a8"}}, y1: {beginAtZero: true, position: "right", grid: {drawOnChartArea: false}, ticks: {color: "#8991a8"}, title: {display: true, text: "Runs", color: "#8991a8"}}}});
    chart("dist", "bar", {labels: RUNS.map(function (r) { return r.date.slice(5); }), datasets: [{label: "Distance", data: RUNS.map(function (r) { return r.distance; }), backgroundColor: RUNS.map(function (r) { return bandColor(r.band); })}]}, {scales: {x: tick, y: {beginAtZero: true, ticks: {color: "#8991a8"}, grid: {color: "#ffffff0b"}, title: {display: true, text: "Miles", color: "#8991a8"}}}});
    chart("pacehr", "line", {labels: RUNS.map(function (r) { return r.date.slice(5); }), datasets: [{label: "Pace s/mi", data: RUNS.map(function (r) { return paceSec(r.avgPace); }), borderColor: "#00f5ff", backgroundColor: "#00f5ff22", yAxisID: "y", tension: .3}, {label: "Avg HR", data: RUNS.map(function (r) { return r.avgHR; }), borderColor: "#ff3d5a", backgroundColor: "#ff3d5a22", yAxisID: "y1", tension: .3}]}, {scales: {x: tick, y: {ticks: {color: "#8991a8"}, grid: {color: "#ffffff0b"}, title: {display: true, text: "Pace s/mi", color: "#8991a8"}}, y1: {position: "right", grid: {drawOnChartArea: false}, ticks: {color: "#8991a8"}, title: {display: true, text: "HR", color: "#8991a8"}}}});
    chart("fit", "scatter", {datasets: [{label: "Runs", data: RUNS.map(function (r) { return {x: paceSec(r.avgPace), y: r.avgHR}; }), backgroundColor: "#10ffa0"}]}, {scales: {x: {ticks: {color: "#8991a8"}, grid: {color: "#ffffff0b"}, title: {display: true, text: "Pace seconds/mi", color: "#8991a8"}}, y: {ticks: {color: "#8991a8"}, grid: {color: "#ffffff0b"}, title: {display: true, text: "Average HR", color: "#8991a8"}}}});
    chart("bubble", "bubble", {datasets: [{label: "Runs", data: RUNS.map(function (r, i) { return {x: i + 1, y: paceSec(r.avgPace), r: Math.max(3, r.distance)}; }), backgroundColor: "#7c3aed99"}]}, {scales: {x: {ticks: {color: "#8991a8"}, grid: {color: "#ffffff0b"}, title: {display: true, text: "Run sequence", color: "#8991a8"}}, y: {ticks: {color: "#8991a8"}, grid: {color: "#ffffff0b"}, title: {display: true, text: "Pace s/mi", color: "#8991a8"}}}});
    var fades = RUNS.map(function (r) { return {date: r.date, pct: fadePct(r.splits)}; }).filter(function (x) { return x.pct !== null; });
    chart("fade", "line", {labels: fades.map(function (x) { return x.date.slice(5); }), datasets: [{label: "Fade %", data: fades.map(function (x) { return x.pct; }), borderColor: "#ffb300", backgroundColor: "#ffb30022", fill: true, tension: .3, pointBackgroundColor: fades.map(function (x) { return x.pct > 0 ? "#ff3d5a" : "#10ffa0"; })}]}, {scales: {x: tick, y: {ticks: {color: "#8991a8"}, grid: {color: "#ffffff0b"}, title: {display: true, text: "Second half vs first half %", color: "#8991a8"}}}});
  }
  if (v.startsWith("runs/")) {
    var r = RUNS.find(function (x) { return x.date === v.split("/")[1]; });
    if (r && r.splits && r.splits.length) {
      chart("splits", "bar", {labels: r.splits.map(function (_, i) { return "Mile " + (i + 1); }), datasets: [{label: "Seconds", data: r.splits, backgroundColor: "#00f5ff"}]}, {scales: {x: tick, y: {beginAtZero: false, ticks: {color: "#8991a8"}, grid: {color: "#ffffff0b"}, title: {display: true, text: "Seconds per mile", color: "#8991a8"}}}});
    }
  }
}
window.addEventListener("hashchange",render);render();
</script>
</body>
