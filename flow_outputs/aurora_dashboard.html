function chart(id,type,data,opts={}){let c=document.getElementById(id);if(!c)return;charts.push(new Chart(c,{type,data,options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#aab6c8',font:{size:10}}}},scales:{x:{ticks:{color:'#91a0b7',maxTicksLimit:8},grid:{color:'#ffffff08'}},y:{ticks:{color:'#91a0b7'},grid:{color:'#ffffff08'}}},...opts}}))}
function card(x){return`<section class="card">${x}</section>`}
function home(){let r=last(), miles=RUNS.slice(-7).reduce((a,x)=>a+x.distance,0), long=RUNS.filter(x=>x.distance>9).slice(-1)[0];return `<div class="eyebrow">Tuesday · 16 November 2026</div><h1 class="title">Your training, illuminated.</h1>${card(`<div class="row"><div><div class="eyebrow">Latest sync</div><div class="stat">${SUMMARY.total_runs} runs</div><div class="muted">${SUMMARY.latest_run_date} · ${SUMMARY.latest_run_distance} mi picked up</div></div><span class="chip good">AUDITED</span></div>`)}${card(`<div class="eyebrow">Today's call</div><div class="title">REST / EASY</div><p class="muted">ACWR is 1.71 from coaching analysis and the latest training week is compressed. Hold intensity until recovery is confirmed.</p><span class="chip risk">HIGH LOAD</span>`)}${card(`<a href="#runs/${r.date}"><div class="eyebrow">Latest run · analysed</div><div class="row"><div><div class="title">${r.date}</div><div class="muted">${r.distance} mi · ${r.pace}/mi · ${band(r.distance)}</div></div><div class="stat">${r.avgHR}<small class="label"> bpm</small></div></div><div class="bar"><i style="width:${Math.min(100,r.avgHR/1.98)}%"></i></div><p class="muted">Breakdown analysis is estimated from lap splits. Tap for full report.</p></a>`)}<div class="grid g2">${card(`<div class="eyebrow">This week</div><div class="stat">${miles.toFixed(2)}</div><div class="muted">miles · ${RUNS.slice(-7).length} runs</div>`)}${card(`<div class="eyebrow">ACWR · official</div><div class="stat">1.71</div><div class="muted">from coaching analysis</div>`)}</div>${card(`<div class="eyebrow">Your weak spot</div><div class="h2">Long-run durability</div><p class="muted">12 of 23 long runs broke down, with a median breakdown at 7.80 miles.</p><a class="chip" href="#analysis/struggle">Open analysis →</a>`)}${card(`<div class="eyebrow">Needs your attention</div><div class="list"><p class="risk">• Critical workload risk: ACWR is 1.71.</p><p class="risk">• Recurring long-run breakdown requires intervention.</p><p class="warn">• Breakdown values are estimated; segment export could not be fetched.</p><p class="muted">• Lifting, nutrition and recovery sources returned no data.</p></div>`)}${card(`<div class="eyebrow">Fuel today</div><div class="empty">NO DATA: nutrition_log_url returned nothing</div>`)}<div class="grid g3">${[['28-day mileage',RUNS.filter(x=>(Date.now()-new Date(x.date))/864e5<28).reduce((a,x)=>a+x.distance,0).toFixed(1)+' mi'],['Longest run','19.03 mi'],['Rest days','not recorded']].map(x=>card(`<div class="label">${x[0]}</div><div class="stat">${x[1]}</div>`)).join('')}</div>`}
function runs(){return `<div class="row"><div><div class="eyebrow">Activity feed</div><h1 class="title">Every run, ready.</h1></div><a class="btn" href="#log/run">Log run</a></div>${RUNS.slice().reverse().map(r=>card(`<a class="run" href="#runs/${r.date}"><div class="row"><div><b>${r.date}</b><div class="muted">${r.distance} mi · ${band(r.distance)} · ${r.pace}/mi</div></div><div><b>${r.avgHR}</b><div class="muted">bpm</div></div></div><div class="row" style="margin-top:12px"><span class="chip">${r.splits.length} laps</span><span class="chip ${r.distance>9?'warn':'good'}">${r.distance>9?'long':'steady'}</span><span class="muted">estimated breakdown →</span></div></a>`)).join('')}`}
function report(date){let r=RUNS.find(x=>x.date===date)||last(),vals=r.splits.map(paceSec),base=vals.slice(0,Math.max(1,Math.floor(vals.length/3))).sort((a,b)=>a-b)[Math.floor(Math.max(1,Math.floor(vals.length/3))/2)],idx=vals.findIndex((v,i)=>i>1&&v>base+20);let br=idx<0?'NONE':(idx+1).toFixed(2);return `<div class="row"><a class="chip" href="#runs">← Runs</a><span class="chip">ESTIMATED</span></div>${card(`<div class="eyebrow">${band(r.distance)} RUN</div><h1 class="title">${r.date}</h1><div class="grid g3"><div><div class="stat">${r.distance}</div><div class="label">miles</div></div><div><div class="stat">${r.pace}</div><div class="label">pace / mi</div></div><div><div class="stat">${r.avgHR}</div><div class="label">avg HR</div></div></div><p class="muted">Score computed from pace, heart rate and consistency. Cadence, weather and fueling are not recorded.</p>`)}${card(`<div class="row"><div><div class="eyebrow">Lap profile</div><div class="h2">${br==='NONE'?'Held pace all the way':`Breaks at mile ${br}`}</div></div><span class="chip ${br==='NONE'?'good':'risk'}">${br==='NONE'?'NO BREAKDOWN':'ESTIMATED'}</span></div><div class="chartbox"><canvas id="split"></canvas></div><p class="muted">Baseline band is computed from the first third of supplied lap splits. Slow laps remain visible and are not corrected.</p>`)}${card(`<div class="eyebrow">Context</div><div class="grid g2"><span class="chip">Climb / mi: ${(r.ascent/r.distance).toFixed(1)} ft</span><span class="chip">HR: ${r.avgHR}/198</span><span class="chip">Fast start: not recorded</span><span class="chip">Prior 7d: not recorded</span><span class="chip">Calories: ${r.calories}</span><span class="chip">Fuel: not recorded</span></div>`)}${card(`<div class="eyebrow">Written coaching report</div><div class="report"><h3>Run summary</h3><p>This ${r.distance}-mile ${band(r.distance).toLowerCase()} run averaged ${r.pace}/mi at ${r.avgHR} bpm. The lap profile is preserved exactly from the audited Garmin activity. Breakdown status is estimated because the segment export could not be fetched.</p><h3>Next 48 hours</h3><p>Keep the next session easy and avoid adding intensity while the official ACWR remains 1.71.</p></div>`)}<div class="row"><a class="btn secondary" href="#runs/${RUNS[Math.max(0,RUNS.indexOf(r)-1)].date}">← Previous</a><a class="btn secondary" href="#runs/${RUNS[Math.min(RUNS.length-1,RUNS.indexOf(r)+1)].date}">Next →</a></div>`}
function log(){return `${card(`<div class="eyebrow">Quick log</div><h1 class="title">Capture the effort.</h1><form id="runform" class="form"><label>Date<input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></label><label>Distance, miles<input name="distance" type="number" step=".01" required></label><label>Time<input name="time" placeholder="45:00" required></label><label>Average HR<input name="hr" type="number" required></label><label>RPE <input name="rpe" type="range" min="1" max="10" value="5"></label><button class="btn">Save and view report</button></form>`)}
function fuel(date){return `${card(`<div class="row"><div><div class="eyebrow">Fuel</div><h1 class="title">${date||'Today'}</h1></div><label class="btn">Import CSV<input id="fuelcsv" type="file" accept=".csv,text/csv" hidden></label></div>`)}${NUTRITION.length?NUTRITION.map(x=>card(`${x.date} · ${x.kcal||'not recorded'} kcal`)).join(''):card('<div class="empty">NO DATA: nutrition_log_url returned nothing. Import a CalTrak CSV to begin.</div>')}`}
// Remaining rows are retained in the embedded activity source above; all charts are generated from RUNS.
function analysis(){let long=RUNS.filter(x=>x.distance>9),weeks={};RUNS.forEach(r=>{let d=new Date(r.date),m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));let k=m.toISOString().slice(0,10);weeks[k]=(weeks[k]||0)+r.distance});return `<div class="eyebrow">Analysis</div><h1 class="title">Find the signal.</h1>${card(`<div class="row"><div><div class="h2">Where you struggle</div><p class="muted">12 of 23 long runs broke down. Median breakdown: 7.80 mi.</p></div><span class="chip risk">HIGH RISK</span></div><p class="muted">SOURCE: ESTIMATED. The lap-splits segment export could not be fetched; exact breakdown points need human review.</p>`)}${card(`<div class="h2">Weekly load</div><div class="chartbox"><canvas id="load"></canvas></div><p class="muted">Weekly miles computed from the embedded activity rows.</p>`)}${card(`<div class="h2">Pace and heart rate</div><div class="chartbox"><canvas id="scatter"></canvas></div><p class="muted">Shorter pace is faster; each dot is one audited run.</p>`)}${card(`<div class="h2">Coaching directives</div><div class="list"><p>1. Restore safe workload balance.</p><p>2. Improve long-run pace durability.</p><p>3. Replace irregular spikes with repeatable weeks.</p></div>`)}${card(`<div class="empty">Lifting: NO DATA — lifting_log_url returned nothing and audit found no lifting sessions.</div>`)}${card(`<div class="empty">Nutrition: NO DATA — nutrition_log_url returned nothing.</div>`)}`}
function data(){return `${card(`<div class="row"><div><div class="eyebrow">Data vault</div><h1 class="title">Source of truth.</h1></div><button class="btn secondary" onclick="downloadCSV()">Export CSV</button></div><p class="muted">${RUNS.length} activity rows retained. Optional Garmin fields not present in the source are shown as not recorded.</p>`)}${card(`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Distance</th><th>Time</th><th>Pace</th><th>HR</th><th>Cadence</th><th>Calories</th><th>Ascent</th><th>Laps</th></tr></thead><tbody>${RUNS.map(r=>`<tr onclick="go('#runs/${r.date}')"><td>${r.date}</td><td>${r.distance}</td><td>${r.time}</td><td>${r.pace}</td><td>${r.avgHR}</td><td>${r.cadence}</td><td>${r.calories}</td><td>${r.ascent}</td><td>${r.splits.length}</td></tr>`).join('')}</tbody></table></div>`)}${card(`<div class="h2">Audit notes</div><p class="muted">72/72 records retained; no duplicates or corrections. Title, stride length, Training Stress Score and Steps were blank. Weather fields were not present. The 2026-07-26 local/file date corresponds to UTC 2026-07-27.</p>`)}`}
function lift(){return card(`<div class="eyebrow">Strength</div><h1 class="title">Start a session.</h1><div class="empty">NO DATA: lifting_log_url returned nothing and audit found no lifting sessions. Your own sessions can be logged here.</div><form id="liftform" class="form" style="margin-top:15px"><label>Bodyweight, lb<input name="bw" type="number" placeholder="not recorded"></label><label>Exercise<input name="ex" placeholder="Exercise name"></label><label>Reps<input name="reps" type="number" value="5"></label><label>Added weight, lb<input name="weight" type="number" value="0"></label><button class="btn">END SESSION</button></form>`)}
function render(){nav();charts.forEach(c=>c.destroy());charts=[];let h=location.hash||'#home',view=h==='#home'?home():h==='#runs'?runs():h==='#log/run'?log():h==='#analysis'||h.startsWith('#analysis/')?analysis():h==='#data'?data():h==='#lift'?lift():h.startsWith('#fuel')?fuel(h.split('/')[1]):h.startsWith('#runs/')?report(h.split('/')[1]):home();document.getElementById('app').innerHTML=view;requestAnimationFrame(()=>{if(h.startsWith('#runs/')){let r=RUNS.find(x=>x.date===h.split('/')[1])||last();chart('split','line',{labels:r.splits.map((_,i)=>i+1),datasets:[{label:'pace sec/mi',data:r.splits.map(paceSec),borderColor:'#00f5ff',backgroundColor:'#00f5ff22',fill:true,tension:.3}]},{scales:{y:{reverse:true}}})}if(h==='#analysis'||h.startsWith('#analysis/')){let w={};RUNS.forEach(r=>{let d=new Date(r.date),m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));let k=m.toISOString().slice(5,10);w[k]=(w[k]||0)+r.distance});chart('load','bar',{labels:Object.keys(w),datasets:[{label:'miles',data:Object.values(w),backgroundColor:'#7c3aed'}]});chart('scatter','scatter',{datasets:[{label:'runs',data:RUNS.map(r=>({x:r.avgHR,y:paceSec(r.pace)})),backgroundColor:'#00f5ff'}]},{scales:{y:{reverse:true,title:{display:true,text:'pace seconds'}}})}})})}
document.getElementById('runform')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),d=f.get('date'),t=f.get('time'),r={date:d,distance:+f.get('distance'),time:t,avgHR:+f.get('hr'),cadence:null,pace:pstr(sec(t)/(+f.get('distance'))),calories:null,ascent:null,splits:[],maxHR:null,descent:null};let i=RUNS.findIndex(x=>x.date===d);i>=0?RUNS[i]=r:RUNS.push(r);localStorage.aurora_last_seen_run=d;toast('Run saved');go('#runs/'+d)});
document.getElementById('liftform')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),x={date:new Date().toISOString().slice(0,10),bodyweight:f.get('bw')||null,exercise:f.get('ex')||'not recorded',reps:+f.get('reps'),weight:+f.get('weight')};LIFTS.push(x);localStorage.aurora_lifts=JSON.stringify(LIFTS);toast('Session saved');go('#lift')});
document.getElementById('fab').onclick=()=>{document.getElementById('sheet').classList.toggle('open');document.getElementById('modalback').classList.toggle('open')};document.getElementById('modalback').onclick=()=>{document.getElementById('sheet').classList.remove('open');document.getElementById('modalback').classList.remove('open')};
document.getElementById('csv').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader;rd.onload=()=>{let lines=rd.result.trim().split(/\r?\n/),head=lines.shift().split(',').map(x=>x.toLowerCase()),di=head.findIndex(x=>/date|day/.test(x)),ki=head.findIndex(x=>/calories|kcal|energy/.test(x)),pi=head.findIndex(x=>x==='protein'),ci=head.findIndex(x=>/carb/.test(x)),fi=head.findIndex(x=>x==='fat');lines.forEach(l=>{let a=l.split(',');if(a[di])NUTRITION.push({date:a[di],kcal:+a[ki]||null,protein:+a[pi]||null,carbs:+a[ci]||null,fat:+a[fi]||null})});localStorage.aurora_nutrition=JSON.stringify(NUTRITION);toast('CalTrak import saved');go('#fuel/'+(NUTRITION.at(-1)?.date||''))};rd.readAsText(f)};
function downloadCSV(){let s='Date,Distance,Time,Avg HR,Cadence,Pace,Calories,Ascent,Lap Splits\n'+RUNS.map(r=>[r.date,r.distance,r.time,r.avgHR,r.cadence,r.pace,r.calories,r.ascent,r.splits.join(' | ')].join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='activity.csv';a.click()}
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
