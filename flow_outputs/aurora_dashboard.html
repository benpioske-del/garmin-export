<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050810">
<title>Aurora Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#050810;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.1);--muted:#91a0b7;--text:#f4f7fb;--cyan:#00f5ff;--violet:#7c3aed;--green:#10ffa0;--amber:#ffb300;--red:#ff3d5a}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0%,#24114c 0,transparent 35%),radial-gradient(circle at 100% 20%,#073d4a 0,transparent 30%),#050810}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E")}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{border:0;color:inherit;cursor:pointer}
.app{max-width:1180px;margin:auto;padding:18px 16px 100px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand{font-weight:900;letter-spacing:-.06em;font-size:22px}
.brand i{font-style:normal;background:linear-gradient(90deg,var(--violet),var(--cyan));color:transparent;background-clip:text}
.status{font-size:11px;color:var(--green);border:1px solid #10ffa055;border-radius:20px;padding:7px 10px}
.status:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;backdrop-filter:blur(20px);margin:12px 0;animation:up .45s both}
.hero{padding:24px;background:linear-gradient(135deg,#21104a99,#052f3d77);border-color:#8b5cf655}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{font-size:28px;font-weight:900;letter-spacing:-.06em;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,#fff,var(--cyan));color:transparent;background-clip:text}
.label,.muted{color:var(--muted);font-size:12px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--cyan);font-weight:800}
.title{font-size:27px;font-weight:900;letter-spacing:-.06em;margin:4px 0 10px}
.h2{font-size:18px;font-weight:800;margin:2px 0 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-flex;padding:6px 9px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:11px}
.good{color:var(--green)}
.warn{color:var(--amber)}
.risk{color:var(--red)}
.btn{background:linear-gradient(90deg,var(--violet),#2563eb);padding:12px 15px;border-radius:12px;font-weight:800;min-height:44px}
.btn.secondary{background:#ffffff10;border:1px solid var(--line)}
.fab{position:fixed;right:20px;bottom:76px;width:56px;height:56px;border-radius:50%;font-size:27px;background:linear-gradient(135deg,var(--violet),var(--cyan));z-index:4;box-shadow:0 10px 35px #00f5ff44}
.tabs{position:fixed;z-index:3;bottom:0;left:0;right:0;background:#080d18ef;border-top:1px solid var(--line);display:flex;justify-content:center;padding:9px 5px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(20px)}
.tabs a{font-size:10px;color:var(--muted);padding:7px 12px;text-align:center}
.tabs a.active{color:var(--cyan)}
.tabs b{display:block;font-size:17px;margin-bottom:2px}
.run{transition:.2s}
.run:hover{border-color:#00f5ff66;transform:translateY(-2px)}
canvas{max-height:280px}
.chartbox{height:270px;position:relative}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:11px;min-width:650px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--cyan);position:sticky;top:0;background:#0b1120}
.empty{padding:24px;text-align:center;border:1px dashed #ffffff2b;border-radius:16px;color:var(--muted)}
.empty strong{display:block;color:var(--text);margin-bottom:8px}
.form{display:grid;gap:12px}
.form label{font-size:12px;color:var(--muted)}
.form input,.form select,.form textarea{width:100%;background:#ffffff09;border:1px solid var(--line);border-radius:11px;color:var(--text);padding:12px;outline:0}
.sheet{position:fixed;inset:auto 0 0;background:#0b1120;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px;z-index:10;display:none}
.sheet.open{display:block}
.sheet button{display:block;width:100%;margin:8px 0;text-align:left;background:#ffffff09;padding:15px;border-radius:12px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-100px);background:#162238;border:1px solid #ffffff22;border-radius:99px;padding:12px 18px;z-index:20;transition:.3s}
.toast.show{transform:translateX(-50%) translateY(0)}
.bar{height:8px;background:#ffffff12;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));border-radius:9px}
.notice{border-left:3px solid var(--red);padding-left:12px}
.list{display:grid;gap:9px}
.list p{margin:0}
.report p{color:#c5cfdd;line-height:1.6;font-size:13px}
.report h3{margin-top:22px}
.modalback{position:fixed;inset:0;background:#0009;z-index:9;display:none}
.modalback.open{display:block}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(min-width:760px){.app{padding-bottom:30px}.tabs{position:static;background:none;border:0;justify-content:flex-start;padding:0;margin-bottom:20px}.tabs a{font-size:12px}.tabs b{display:inline;margin-right:5px}.fab{bottom:25px}}
/* Feature styles ported from the live Aurora dashboard. */
.signal{border-color:#00f5ff44}
.sync{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:#ffffff06;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px;color:var(--muted);font-size:12px}
.sync b{color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stats>div{background:#ffffff05;border:1px solid var(--line);border-radius:12px;padding:10px}
.stats .value{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:4px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;overflow-x:auto;padding:6px 0}
.heat i{display:block;width:11px;height:11px;border-radius:2px;background:#ffffff0d}
.heat i.h1{background:#10ffa044}
.heat i.h2{background:#10ffa088}
.heat i.h3{background:#10ffa0bb}
.heat i.h4{background:#10ffa0}
.group{margin:22px 0 2px}
.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#ffffff0b;color:var(--muted);font-size:11px}
.run-card{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:9px 0;padding:15px;border:1px solid var(--line);border-radius:16px;background:#ffffff04}
.run-card:hover{border-color:#00f5ff88}
</style>
</head>

<div id="toast" class="toast"></div><div id="modalback" class="modalback"></div>

</div>

  if(!name||est==null)return null;
  var prev=best[name.toLowerCase()];
  return prev!=null&&est>prev?name+" e1RM "+est+" lb (previous "+prev+")":null;
}
function liftPrList(s,index){
  var out=[],auto=liftPrFor(s,liftBestBefore(index));
  if(auto)out.push(auto);
  (s.prs||[]).forEach(function(p){if(String(p||"").trim())out.push(String(p).trim())});
  return out;
}
function setLiftMode(m){
  LIFT_MODE=m==="advanced"?"advanced":"simple";

}

async function syncGarmin(btn){
  if(btn){btn.dataset.label=btn.textContent;btn.disabled=true;btn.textContent="Syncing..."}
  // A toast lasts 2.5 seconds and a sync takes 15-90, so the bar carries the
  // state. Without this the button silently returned to its old label and a
  // finished sync looked like nothing had happened.
  setSyncStatus("Syncing - this usually takes 15 to 90 seconds");
  show("Syncing with Garmin - usually 15 to 90 seconds");
  try{
    var tk=new URLSearchParams(location.search).get("tk")||"";
    var h={"Content-Type":"application/json"};if(tk)h["X-Dash-Token"]=tk;
    var r=await fetch("/sync",{method:"POST",headers:h,credentials:"same-origin"});
    var res=await r.json().catch(function(){return{}});
    if(r.status===401||r.status===403){throw new Error("dashboard token missing - reload the page from the link the server printed")}
    if(!r.ok||!res.ok){var tail=(res&&res.output)?String(res.output).trim().split("\n").slice(-1)[0]:("HTTP "+r.status);throw new Error(tail)}
    var newBit=res.new_runs==null?null:(res.new_runs+" new run"+(res.new_runs===1?"":"s"));
    var stamp=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    setSyncStatus("Synced "+stamp+(newBit?" - "+newBit:"")+" - refreshing");
    var refreshErr=null;
    try{
      if(window.auroraReloadAll){await window.auroraReloadAll()}else{location.reload()}
    }catch(e){refreshErr=e}
    var bits=[];
    if(newBit){bits.push(newBit)}
    if(SUMMARY&&SUMMARY.total_runs!=null){bits.push(SUMMARY.total_runs+" total")}
    setSyncStatus("Synced "+stamp+(bits.length?" - "+bits.join(", "):"")
      +(refreshErr?" (page refresh failed: "+(refreshErr&&refreshErr.message?refreshErr.message:refreshErr)+")":""));
    show("Garmin sync complete");
  }catch(e){
    var msg=(e&&e.message?e.message:e);
    setSyncStatus("Sync failed: "+msg);
    show("Sync failed: "+msg)
  }
  finally{if(btn){btn.disabled=false;btn.textContent=btn.dataset.label||"Sync Garmin now"}}
}

function parseNutritionCSV(text){
  var lines=String(text||"").trim().split(/\r?\n/);
  if(!lines.length)return[];
  var head=lines.shift().split(",").map(function(x){return x.trim().toLowerCase()});
  var di=head.findIndex(function(x){return /date|day/.test(x)});
  var ki=head.findIndex(function(x){return /calories|kcal|energy/.test(x)});
  var pi=head.findIndex(function(x){return x==="protein"});
  var ci=head.findIndex(function(x){return /carb/.test(x)});
  var fi=head.findIndex(function(x){return x==="fat"});
  var out=[];
  lines.forEach(function(line){
    if(!line.trim())return;
    var a=line.split(",");
    if(di<0||!a[di])return;
    out.push({date:a[di].trim(),kcal:ki>=0?(+a[ki]||null):null,protein:pi>=0?(+a[pi]||null):null,carbs:ci>=0?(+a[ci]||null):null,fat:fi>=0?(+a[fi]||null):null});
  });
  return out;
}
function importCSV(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var text=String(rd.result||"");
    var rows=parseNutritionCSV(text);
    if(!rows.length){toast("No readable nutrition rows");return}
    rows.forEach(function(row){
      var i=NUTRITION.findIndex(function(x){return x.date===row.date});
      if(i>=0){NUTRITION[i]=row}else{NUTRITION.push(row)}
    });
    NUTRITION.sort(function(a,b){return String(a.date).localeCompare(String(b.date))});
    localStorage.setItem("aurora_nutrition",JSON.stringify(NUTRITION));
    toast("Imported "+rows.length+" day(s) locally");
    go("#fuel/"+rows[rows.length-1].date);
  };
  rd.readAsText(f);
}

function fuelAmt(v,unit){return v==null?"--":(Math.round(Number(v)*10)/10)+unit}
function fuelEnergy(f){
  var total=null;
  ((f&&f.items)||[]).forEach(function(e){
    var k=e.kcal!=null?Number(e.kcal):(e.carbs_g!=null?Number(e.carbs_g)*4:null);
    if(k!=null&&isFinite(k)){total=(total==null?0:total)+k}
  });
  return total;
}
function fuelDelta(splits){
  var vals=(splits||[]).map(paceSec).filter(Number.isFinite);
  if(vals.length<4)return null;
  var half=Math.floor(vals.length/2);
  var first=vals.slice(0,half),second=vals.slice(half);
  var a=first.reduce(function(p,v){return p+v},0)/first.length;
  var b=second.reduce(function(p,v){return p+v},0)/second.length;
  if(!a)return null;
  return {first:Math.round(a),second:Math.round(b),delta:Math.round(b-a),pct:Math.round((b-a)/a*1000)/10,n:vals.length};
}
function runFade(r){
  // Prefer the server's canonical fade point. It covers runs with no fuel
  // entry too, and uses the same >=4-split rule as run_fuel.fade().
  var p=r&&r.fadePoint;
  if(p)return {first:p.first_half_s_per_mi,second:p.second_half_s_per_mi,delta:p.fade_s_per_mi,pct:p.fade_pct,n:p.splits_used};
  var f=r&&r.fuel;
  if(f&&f.fade)return {first:f.fade.first_half_s_per_mi,second:f.fade.second_half_s_per_mi,delta:f.fade.fade_s_per_mi,pct:f.fade.fade_pct,n:f.fade.splits_used};
  return fuelDelta(r&&r.splits);
}
function fadeOnsetHtml(p){

function fadePointData(){

    var p=r&&r.fadePoint, o=p&&p.fade_onset;

    return {
      date:r.date,
      distance:r.distance,
      mile:o.onset_mile,
      time:o.onset_time_s,

      pct:p.fade_pct,

    };

function fadeScoreChip(score){
  var n=Number(score);
  if(!isFinite(n))return '<span class="chip">--</span>';
  var cls=n>=70?"risk":n>=40?"warn":"good";
  return '<span class="chip '+cls+'">'+Math.round(n)+'/100</span>';

function fuelWhere(e){
  if(e.mile!=null)return "mi "+e.mile;
  return e.at||"unmarked";
}
function fuelWhat(e){
  var out=[];
  if(e.what)out.push(e.what);
  if(e.oz!=null)out.push(e.oz+" oz");
  if(e.kcal!=null)out.push(e.kcal+" kcal");
  if(e.carbs_g!=null)out.push(e.carbs_g+" g carbs");
  if(e.sodium_mg!=null)out.push(e.sodium_mg+" mg sodium");
  return out.length?out.join(" &middot; "):e.kind;
}

      +'<div><div class="stat">'+fuelAmt(t.kcal," kcal")+'</div><div class="label">energy'+(rt.kcal_per_h!=null?" &middot; "+fuelAmt(rt.kcal_per_h,"/h"):"")+'</div></div>'

      +'<div><div class="stat">'+fuelAmt(t.sodium_mg," mg")+'</div><div class="label">sodium'+(rt.sodium_mg_per_h!=null?" &middot; "+fuelAmt(rt.sodium_mg_per_h,"/h"):"")+'</div></div>'
      +'<div><div class="stat">'+items.length+'</div><div class="label">events</div></div>'

function fuelToken(){return new URLSearchParams(location.search).get("tk")||""}
function fuelPost(payload){
  var h={"Content-Type":"application/json"};
  var tk=fuelToken();if(tk)h["X-Dash-Token"]=tk;
  return fetch("/api/fuel",{method:"POST",headers:h,credentials:"same-origin",body:JSON.stringify(payload)})
    .then(function(r){return r.json().catch(function(){return{}}).then(function(res){
      if(!r.ok){throw new Error(res.detail||res.error||("HTTP "+r.status))}
      return res;
    })});
}
function fuelMsg(btn,text){
  var date=btn&&btn.getAttribute?btn.getAttribute("data-date"):null;
  var el=date?document.getElementById("fuel-msg-"+date):null;
  if(el)el.textContent=text;
  if(typeof toast==="function")toast(text);
}
function fuelRun(date){return RUNS.find(function(x){return x.date===date})||null}
function fuelAddRow(btn,ev){
  var date=typeof btn==="string"?btn:(btn&&btn.getAttribute?btn.getAttribute("data-date"):null);
  var body=date?document.getElementById("fuel-rows-"+date):null;
  if(!body)return;
  var tmp=document.createElement("tbody");
  tmp.innerHTML=fuelRowHtml(ev||{});
  if(tmp.firstElementChild)body.appendChild(tmp.firstElementChild);
}
function fuelRemoveRow(btn){
  var tr=btn&&btn.closest?btn.closest("tr"):null;
  if(tr&&tr.parentNode)tr.parentNode.removeChild(tr);
}
function fuelCollect(date){
  var body=document.getElementById("fuel-rows-"+date);
  var out=[];
  if(!body)return out;
  Array.prototype.forEach.call(body.querySelectorAll("tr"),function(tr){
    var ev={};
    Array.prototype.forEach.call(tr.querySelectorAll(".fin"),function(inp){
      var f=inp.getAttribute("data-f");
      var v=String(inp.value||"").trim();
      ev[f]=v===""?null:v;
    });
    if(!ev.kind)return;
    out.push(ev);
  });
  return out;
}
function fuelReload(){
  if(window.auroraReloadAll)return window.auroraReloadAll();
  return Promise.resolve().then(function(){render()});
}
function fuelSave(btn){
  var date=btn.getAttribute("data-date");
  var r=fuelRun(date);
  var events=fuelCollect(date);
  fuelMsg(btn,"Saving...");
  fuelPost({date:date,activity_id:r?r.activityId:null,events:events,note:r&&r.fuel?r.fuel.note:"",source:"manual",needs_review:false})
    .then(fuelReload)
    .then(function(){fuelMsg(btn,"Intake saved")})
    .catch(function(e){fuelMsg(btn,"Save failed: "+(e&&e.message?e.message:e))});
}
function fuelClear(btn){
  var date=btn.getAttribute("data-date");
  var r=fuelRun(date);
  fuelMsg(btn,"Clearing...");
  fuelPost({delete:true,date:date,activity_id:r?r.activityId:null})
    .then(fuelReload)
    .then(function(){fuelMsg(btn,"Intake cleared")})
    .catch(function(e){fuelMsg(btn,"Clear failed: "+(e&&e.message?e.message:e))});
}
function fuelSuggest(btn){
  var date=btn.getAttribute("data-date");
  var h={};var tk=fuelToken();if(tk)h["X-Dash-Token"]=tk;
  fuelMsg(btn,"Looking for intake in the journal note...");
  fetch("/api/fuel",{headers:h,credentials:"same-origin"})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
    .then(function(p){
      var entry=(p.runs||[]).find(function(x){return x.date===date});
      var items=(entry&&entry.suggested)||[];
      if(!items.length){fuelMsg(btn,"No intake phrases found in the note");return}
      items.forEach(function(ev){fuelAddRow(date,ev)});
      fuelMsg(btn,"Added "+items.length+" suggestion(s). Review, then save.");
    })
    .catch(function(e){fuelMsg(btn,"Could not read suggestions: "+(e&&e.message?e.message:e))});
}

function weatherCard(r){
  var c=contextFor(r);
  if(!c){return card('<div class="eyebrow">Location &amp; weather</div><div class="h2">not recorded</div><p class="muted">This run has no Garmin start record or archived weather.</p>')}
  var wx=c.weather||{},bits=[];
  if(wx.tempF!=null)bits.push(Math.round(wx.tempF)+"F at the start");
  if(wx.feelsF!=null)bits.push("feels "+Math.round(wx.feelsF)+"F");
  if(wx.humidityPct!=null)bits.push(Math.round(wx.humidityPct)+"% humidity");
  if(wx.windMph!=null)bits.push(Math.round(wx.windMph)+" mph wind");
  if(wx.dewF!=null)bits.push("dew "+Math.round(wx.dewF)+"F");
  if(wx.precipIn!=null&&Number(wx.precipIn)>0)bits.push(wx.precipIn+" in rain");
  var weatherText=bits.length?bits.join(" &middot; "):"no weather fields recorded";
  var adj=adjustedSeconds(r),allow=weatherAllowance(r);
  var adjLabel=adj==null?"not recorded":durStr(adj);
  var adjNote=adj==null
    ? "No recorded temperature for this run, so no adjusted time is shown."
    : "Illustrative only: Classic applies a 0.2% per &deg;F allowance above 50&deg;F"
      +(allow?(" ("+allow+"% at "+Math.round(c.tempF)+"&deg;F)"):"")
      +". It does not predict performance. Cold and wind are not modelled, and hills, effort and fatigue also move time.";
  return card('<div class="eyebrow">Location &amp; weather</div>'
    +'<div class="grid g3"><div><div class="label">Start location</div><div class="h2">'+esc(c.location||"not recorded")+'</div></div><div><div class="label">Start time (Garmin)</div><div class="h2">'+esc(c.startLocal||"not recorded")+'</div></div><div><div class="label">Recorded temperature</div><div class="h2">'+(c.tempF==null?"not recorded":Math.round(c.tempF)+"&deg;F")+'</div></div></div>'
    +'<p class="muted">Weather at start: '+weatherText+'.</p>'
    +'<div class="row" style="margin-top:12px"><div><div class="label">Recorded time</div><div class="stat">'+esc(r.time||"not recorded")+'</div></div><div><div class="label">Weather-adjusted time</div><div class="stat">'+adjLabel+'</div></div></div>'
    +'<p class="muted">'+adjNote+'</p>'
    +'<p class="muted">Archived Open-Meteo values resolved before publish - no live weather lookup in the page (CC BY 4.0).</p>');
}

function commentsCard(r){

function report(date){
  var r=RUNS.find(function(x){return x.date===date})||last();
  if(!r){return card('<div class="empty"><strong>Run not found</strong>That date is not in the activity log.</div>')}
  var vals=r.splits.map(paceSec).filter(Number.isFinite);
  var br="NONE";
  if(vals.length){
    var n=Math.max(1,Math.floor(vals.length/3));
    var base=vals.slice(0,n).slice().sort(function(a,b){return a-b})[Math.floor(n/2)];
    var idx=vals.findIndex(function(v,i){return i>1&&v>base+20});
    if(idx>=0){br=(idx+1).toFixed(2)}
  }
  var fast=vals.length?mss(Math.min.apply(null,vals)):null;
  var slow=vals.length?mss(Math.max.apply(null,vals)):null;
  return '<div class="row"><a class="chip" href="#runs">&larr; Runs</a>'+(r.manual?'<a class="chip" href="#log/run/'+encodeURIComponent(r.date)+'">Edit run</a>':'')+'<span class="chip">'+(r.manual?'MANUAL ENTRY':'ESTIMATED')+'</span></div>'
    +card('<div class="eyebrow">'+band(r.distance)+' RUN</div><h1 class="title">'+esc(r.date)+'</h1><div class="grid g3"><div><div class="stat">'+r.distance+'</div><div class="label">miles</div></div><div><div class="stat">'+esc(r.pace)+'</div><div class="label">pace m:ss/mi</div></div><div><div class="stat">'+(r.avgHR==null?"--":r.avgHR)+'</div><div class="label">avg HR</div></div></div><p class="muted">The 1-100 execution score, recorded weather and comments appear below.</p>')
    +scoreCard(r)
    +weatherCard(r)
    +card('<div class="row"><div><div class="eyebrow">Lap profile</div><div class="h2">'+(r.manual?"No lap data":(br==="NONE"?"Held pace all the way":"Breaks at mile "+br))+'</div>'+(vals.length?'<div class="muted">Splits '+fast+'&ndash;'+slow+'/mi</div>':'')+'</div><span class="chip '+(r.manual?"warn":(br==="NONE"?"good":"risk"))+'">'+(r.manual?"MANUAL ENTRY":(br==="NONE"?"NO BREAKDOWN":"ESTIMATED"))+'</span></div>'+(r.splits.length?'<div class="chartbox"><canvas id="split"></canvas></div>':'<div class="empty"><strong>Splits not recorded</strong>This activity source did not provide lap splits.</div>')+'<p class="muted">Baseline band is computed from the first third of supplied lap splits. Slow laps remain visible and are not corrected.</p>')
    +fuelCard(r)
    +commentsCard(r)
    +card('<div class="eyebrow">Context</div><div class="grid g2"><span class="chip">Climb / mi: '+(r.ascent!=null&&r.distance?fmt(r.ascent/r.distance):"not recorded")+' ft</span><span class="chip">HR: '+(r.avgHR==null?"not recorded":r.avgHR+"/198")+'</span><span class="chip">Max HR: '+(r.maxHR==null?"not recorded":r.maxHR)+'</span><span class="chip">Cadence: '+(r.cadence==null?"not recorded":r.cadence)+'</span><span class="chip">Calories: '+(r.calories==null?"not recorded":r.calories)+'</span><span class="chip">Laps: '+(r.laps==null?"not recorded":r.laps)+'</span></div>')
    +card('<div class="eyebrow">Written coaching report</div><div class="report"><h3>Run summary</h3><p>This '+r.distance+'-mile '+band(r.distance).toLowerCase()+' run averaged '+esc(r.pace)+'/mi at '+(r.avgHR==null?"an unrecorded heart rate":r.avgHR+" bpm")+'. '+(r.manual?"This is a manual entry; lap splits and device metrics are not recorded.":"The lap profile is preserved exactly from the audited Garmin activity.")+'</p></div>');
}

function saveRun(e){
  e.preventDefault();
  var form=e.target;
  var f=new FormData(form);
  var date=String(f.get("date")||"").trim();
  var t=f.get("time")||"0:00",dist=+f.get("distance")||0;
  var events=fuelCollect("log");
  var note=String(f.get("note")||"").trim();
  var hadFuel=form.getAttribute("data-had-fuel")==="true";
  var editing=form.getAttribute("data-editing")==="true";
  var label=editing?"Save changes":"Save and view report";
  var payload={date:date,distance:dist,time:t,hr:f.get("hr"),rpe:f.get("rpe")};
  // A blank fuel table on a run that had no intake means "do not create an
  // empty sidecar". On an edit it means "remove the old intake".
  if(events.length||note){
    payload.fuel={events:events,note:note,source:"manual",needs_review:false};
  }else if(hadFuel){
    payload.fuel={delete:true};
  }
  var btn=form.querySelector("button.btn:not(.secondary)");
  if(btn){btn.disabled=true;btn.textContent=editing?"Saving changes...":"Saving..."}
  var tk=new URLSearchParams(location.search).get("tk")||"";
  var h={"Content-Type":"application/json"};if(tk)h["X-Dash-Token"]=tk;
  function done(msg){
    if(btn){btn.disabled=false;btn.textContent=label}
    if(msg){toast(msg)}
  }
  // Persist on the server. The old version wrote only to localStorage, so the
  // run vanished on the next reload and a Garmin sync never saw it.
  fetch("/api/runs",{method:"POST",headers:h,credentials:"same-origin",body:JSON.stringify(payload)})
    .then(function(r){
      return r.json().catch(function(){return{}}).then(function(res){
        if(!r.ok||!res.ok){throw new Error((res&&(res.detail||res.error))||("HTTP "+r.status))}
        return res;
      });
    })
    .then(function(){
      done(editing?"Run and fuel updated":"Run saved");
      if(window.auroraReloadAll){
        return window.auroraReloadAll().then(function(){go("#runs/"+date)});
      }
      go("#runs/"+date);
    })
    .catch(function(err){done("Run not saved: "+(err&&err.message?err.message:err))});
}

function lift(){
  var rows=LIFTS.map(function(s,i){return liftRow(s,i)}).reverse().join("");
  var prCount=LIFTS.reduce(function(n,s,i){return n+liftPrList(s,i).length},0);
  return card('<div class="eyebrow">Strength</div><h1 class="title">Start a session.</h1>'
    +liftForm()
    +'<p class="muted">'+LIFTS.length+' session(s) &middot; '+prCount+' PR(s) recorded. Sessions stay in this browser; they are not uploaded to the server.</p>')
    +(rows||card('<div class="empty"><strong>NO DATA: lifting_log_url returned nothing.</strong>Audit returned no lifting sessions. Your own sessions can be logged here.</div>'));

function saveLift(e){
  e.preventDefault();
  var f=new FormData(e.target);
  var mode=f.get("mode")==="advanced"?"advanced":"simple";
  var bw=f.get("bw"),rpe=f.get("rpe"),rest=f.get("rest");
  var prs=String(f.get("prs")||"").split(",").map(function(x){return x.trim()}).filter(Boolean);
  var best=liftBestBefore(LIFTS.length);
  var rec={
    id:Date.now()+"-"+Math.random().toString(36).slice(2,8),
    date:new Date().toISOString().slice(0,10),
    mode:mode,
    bodyweight:(bw==null||bw==="")?null:+bw,
    exercise:mode==="advanced"?(String(f.get("ex")||"").trim()||"not recorded"):null,
    sets:mode==="advanced"?Math.max(1,+f.get("sets")||1):null,
    reps:mode==="advanced"?(+f.get("reps")||0):null,
    weight:mode==="advanced"?(+f.get("weight")||0):null,
    rpe:mode==="advanced"&&rpe!=null&&rpe!==""?+rpe:null,
    restSec:mode==="advanced"&&rest!=null&&rest!==""?+rest:null,
    notes:mode==="advanced"?String(f.get("notes")||""):"",
    effort:mode==="simple"?String(f.get("effort")||"medium"):null,
    prs:prs,
    autoPr:null
  };
  rec.autoPr=liftPrFor(rec,best);
  LIFTS.push(rec);
  localStorage.setItem("aurora_lifts",JSON.stringify(LIFTS));
  toast(rec.autoPr||prs.length?"Session saved - PR recorded":"Session saved");
  go("#lift");
}

  var gaps=daysBetween(RUNS);

        });

          rows.push('<tr class="muted"><td>'+esc(dim.label)+'</td><td>'+esc(s.key)+'</td><td>'+s.n+'</td><td colspan="2">hidden (fewer than '+fa.min_group+' runs)</td></tr>');

          :'<div class="empty"><strong>No fade points yet</strong>At least four usable laps are needed for a fade measurement.</div>');
    }
  }
}

function render(){
  charts.forEach(function(c){c.destroy()});
  charts=[];
  for(var i=0;i<RUNS.length;i++){RUNS[i]=normalizeRun(RUNS[i])}
  nav();
  var h=location.hash||"#home";
  var view=h==="#home"?home()
    :h==="#runs"?runs()
    :h==="#log/run"?log()
    :h.indexOf("#log/run/")===0?log(decodeURIComponent(h.split("/")[2]||""))
    :(h==="#analysis"||h.indexOf("#analysis/")===0)?analysis()
    :h==="#data"?data()
    :h==="#lift"?lift()
    :h.indexOf("#fuel")===0?fuel(h.split("/")[1])
    :h.indexOf("#runs/")===0?report(h.split("/")[1])
    :home();
  document.getElementById("app").innerHTML=view;
  var status=document.getElementById("status");
  if(status){status.textContent=window.__AURORA_LIVE__?"LIVE":"SNAPSHOT"}
  // Draw synchronously: the chart boxes have a fixed height, so layout is
  // available immediately. A requestAnimationFrame here silently skipped every
  // chart when the tab was not visible (background tab, restored PWA).
  if(h.indexOf("#runs/")===0){drawSplit(h.split("/")[1])}
  if(h==="#analysis"||h.indexOf("#analysis/")===0){drawAnalysis()}
}

  var s=new URLSearchParams(location.search).get("shared");
  if(!s)return;
  var msg=s==="ok"?"Nutrition imported from the share sheet":s==="empty"?"The shared file had no readable rows":"The shared file could not be read as a nutrition CSV";
  setTimeout(function(){toast(msg)},300);
  if(s==="ok"){setTimeout(function(){go("#fuel")},500)}
})();
</script>
</body>
</html>
