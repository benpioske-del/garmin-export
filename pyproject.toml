[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-export"
version = "1.20.0"
description = "Garmin Connect activity export, safety guards, and CrewAI task bridge"
requires-python = ">=3.12"
dependencies = [
    "fitparse>=1.2.0",
    "garminconnect>=0.3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["export_publish", "garmin_fit_reader", "garmin_sync",
              "capture_supervisor_brief", "fit_audit", "fit_gps_validate",
              "garmin_server", "paths", "backup_data"]

[tool.ruff]
# Catch real defects, not style. E9 is syntax/runtime errors; F is pyflakes:
# unused names, undefined names, shadowed imports, duplicate dict keys. These
# are the rules that find bugs, and every one of them is fixable in this repo.
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
    # fitparse calls the deprecated datetime.utcfromtimestamp once per field.
    # There are ~650k of them across the 56-file corpus, which buries real
    # output. Harmless here: the value is only read for its UTC instant.
    "ignore::DeprecationWarning:fitparse.processors",
]
