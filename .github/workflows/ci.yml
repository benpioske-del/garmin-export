name: CI

# Release gate: lint and test on a clean checkout. Athlete data (FIT files and
# trainloop.db) is never committed, so the suite must pass without it. Tests
# that genuinely need the live corpus skip via the markers in tests/conftest.py;
# a skip here is visible in the log rather than a silent pass.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # garminconnect (>=0.3.13) requires Python >=3.12, so 3.12 is the
        # floor. A 3.10 job cannot install and fails before lint or tests.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -ra
